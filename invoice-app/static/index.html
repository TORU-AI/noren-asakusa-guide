<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>請求書変換アプリ｜ネクストパートナー株式会社</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
    }
    header .logo {
      width: 44px; height: 44px;
      background: #e94560;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
    header p  { font-size: 0.78rem; opacity: .7; margin-top: 2px; }

    /* ─── Main ───────────────────────────────────── */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 32px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .step {
      width: 24px; height: 24px;
      background: #0f3460; color: #fff;
      border-radius: 50%;
      font-size: 0.78rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ─── Upload area ────────────────────────────── */
    #drop-zone {
      border: 2px dashed #c5cad3;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    #drop-zone.dragover,
    #drop-zone:hover { border-color: #0f3460; background: #f4f7ff; }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .upload-text  { color: #555; font-size: 0.92rem; }
    .upload-hint  { color: #aaa; font-size: 0.78rem; margin-top: 6px; }

    #file-preview {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: #f4f7ff;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #file-preview.hidden { display: none !important; }
    #file-preview .file-icon { font-size: 22px; }
    #file-preview .file-info { flex: 1; overflow: hidden; }
    #file-preview .file-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #file-preview .file-size { color: #888; font-size: 0.78rem; margin-top: 2px; }
    #file-preview .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #aaa; font-size: 18px; padding: 4px;
      line-height: 1;
    }
    #file-preview .remove-btn:hover { color: #e94560; }

    /* ─── Markup options ─────────────────────────── */
    .option-group { display: flex; flex-direction: column; gap: 12px; }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      border: 2px solid #e5e8ef;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .option-label:hover { border-color: #0f3460; background: #f9fbff; }
    .option-label input[type="radio"] { display: none; }
    .option-label.selected {
      border-color: #0f3460;
      background: #f0f4ff;
    }
    .radio-dot {
      width: 20px; height: 20px;
      border: 2px solid #c5cad3;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .option-label.selected .radio-dot {
      border-color: #0f3460;
      background: #0f3460;
    }
    .option-label.selected .radio-dot::after {
      content: "";
      width: 8px; height: 8px;
      background: #fff;
      border-radius: 50%;
    }
    .option-text .option-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #222;
    }
    .option-text .option-desc {
      font-size: 0.80rem;
      color: #666;
      margin-top: 3px;
      line-height: 1.5;
    }

    /* ─── Submit button ──────────────────────────── */
    #submit-btn {
      width: 100%;
      padding: 16px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    #submit-btn:hover:not(:disabled) { background: #1a4a8a; }
    #submit-btn:active:not(:disabled) { transform: scale(.98); }
    #submit-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    /* ─── Status ─────────────────────────────────── */
    #status {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-top: 16px;
      line-height: 1.5;
    }
    #status.loading {
      display: flex; align-items: center; gap: 10px;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    #status.success {
      display: flex; align-items: center; gap: 10px;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 3px solid #bfdbfe;
      border-top-color: #1e40af;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #aaa;
      padding: 24px 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">N</div>
  <div>
    <h1>請求書変換アプリ</h1>
    <p>ネクストパートナー株式会社</p>
  </div>
</header>

<main>

  <!-- Step 1: File upload -->
  <div class="card">
    <div class="card-title">
      <span class="step">1</span>
      請求書・見積書をアップロード
    </div>
    <div id="drop-zone">
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf" />
      <div class="upload-icon">📄</div>
      <div class="upload-text">クリックまたはファイルをドラッグ＆ドロップ</div>
      <div class="upload-hint">対応形式：JPG・PNG・GIF・WebP・PDF（最大 20MB）</div>
    </div>
    <div id="file-preview" class="hidden">
      <span class="file-icon" id="file-icon">📄</span>
      <div class="file-info">
        <div class="file-name" id="file-name"></div>
        <div class="file-size" id="file-size"></div>
      </div>
      <button class="remove-btn" id="remove-btn" title="削除">✕</button>
    </div>
  </div>

  <!-- Step 2: Markup option -->
  <div class="card">
    <div class="card-title">
      <span class="step">2</span>
      金額の計算方法を選択
    </div>
    <div class="option-group">

      <label class="option-label selected" id="opt-20">
        <input type="radio" name="markup" value="20" checked />
        <span class="radio-dot"></span>
        <span class="option-text">
          <span class="option-name">20%上乗せ</span>
          <span class="option-desc">全品目の単価に 20% を加算して請求します。<br>例：100,000円 → 120,000円（税別）</span>
        </span>
      </label>

      <label class="option-label" id="opt-40">
        <input type="radio" name="markup" value="40" />
        <span class="radio-dot"></span>
        <span class="option-text">
          <span class="option-name">40%上乗せ</span>
          <span class="option-desc">全品目の単価に 40% を加算して請求します。<br>例：100,000円 → 140,000円（税別）</span>
        </span>
      </label>

      <label class="option-label" id="opt-kanri">
        <input type="radio" name="markup" value="kanri" />
        <span class="radio-dot"></span>
        <span class="option-text">
          <span class="option-name">金額そのまま ＋ 現場管理費（小計の 20%）</span>
          <span class="option-desc">元の金額は変更せず、小計の 20% を現場管理費として追加します。<br>例：100,000円 → 100,000円 ＋ 現場管理費 20,000円</span>
        </span>
      </label>

    </div>
  </div>

  <!-- Step 3: Convert -->
  <div class="card">
    <div class="card-title">
      <span class="step">3</span>
      請求書を生成
    </div>
    <button id="submit-btn" disabled>
      <span>📋</span>
      <span id="btn-text">ファイルを選択してください</span>
    </button>
    <div id="status"></div>
  </div>

</main>

<footer>© ネクストパートナー株式会社　請求書変換アプリ</footer>

<script>
  const dropZone   = document.getElementById("drop-zone");
  const fileInput  = document.getElementById("file-input");
  const filePreview = document.getElementById("file-preview");
  const fileNameEl = document.getElementById("file-name");
  const fileSizeEl = document.getElementById("file-size");
  const fileIconEl = document.getElementById("file-icon");
  const removeBtn  = document.getElementById("remove-btn");
  const submitBtn  = document.getElementById("submit-btn");
  const btnText    = document.getElementById("btn-text");
  const statusEl   = document.getElementById("status");

  let selectedFile = null;

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function setFile(file) {
    selectedFile = file;
    fileNameEl.textContent = file.name;
    fileSizeEl.textContent = formatBytes(file.size);
    fileIconEl.textContent = file.type === "application/pdf" ? "📕" : "🖼️";
    filePreview.classList.remove("hidden");
    submitBtn.disabled = false;
    btnText.textContent = "請求書を変換してダウンロード";
    statusEl.className = "";
    statusEl.style.display = "none";
  }

  function clearFile() {
    selectedFile = null;
    fileInput.value = "";
    filePreview.classList.add("hidden");
    submitBtn.disabled = true;
    btnText.textContent = "ファイルを選択してください";
    statusEl.className = "";
    statusEl.style.display = "none";
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  removeBtn.addEventListener("click", (e) => { e.stopPropagation(); clearFile(); });

  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) { fileInput.files = e.dataTransfer.files; setFile(file); }
  });

  // Radio button visual state
  document.querySelectorAll('input[name="markup"]').forEach(radio => {
    radio.addEventListener("change", () => {
      document.querySelectorAll(".option-label").forEach(l => l.classList.remove("selected"));
      radio.closest(".option-label").classList.add("selected");
    });
  });

  // Submit
  submitBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    const markup = document.querySelector('input[name="markup"]:checked').value;

    submitBtn.disabled = true;
    statusEl.className = "loading";
    statusEl.innerHTML = '<div class="spinner"></div><span>AIが請求書を解析・変換中です。しばらくお待ちください…</span>';

    const form = new FormData();
    form.append("file", selectedFile);
    form.append("markup_type", markup);

    try {
      const res = await fetch("/convert", { method: "POST", body: form });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: "不明なエラーが発生しました" }));
        throw new Error(err.detail || "変換に失敗しました");
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      const cd = res.headers.get("content-disposition") || "";
      const match = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';\n]+)/i);
      const filename = match ? decodeURIComponent(match[1]) : "請求書.pdf";

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      statusEl.className = "success";
      statusEl.innerHTML = "✅　請求書PDFをダウンロードしました。";
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "❌　" + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
